(function(){
  var cfg=window.__FB_CFG||{
    apiKey:"AIzaSyC-7qGOhetQRm-BRubnGhMgNVc7ZxRMpu4",

  var ROOT='subsidy/';
  var fdb=null;
  try{ if(window.firebase&&window.__FB_CFG!=='none'){ (firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(cfg)); fdb=firebase.database(); } }catch(e){ console.warn('firebase',e); }
  function ref(p){ return fdb.ref(ROOT+p); }
  function snapDoc(s){ var v=s.val(); return {id:s.key, exists:v!==null&&v!==undefined, data:function(){return v===null?undefined:v;}, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function flat(obj,prefix,out){
    Object.keys(obj).forEach(function(k){ var v=obj[k], p=prefix?prefix+'/'+k:k;
      if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length) flat(v,p,out); else out[p]=(v===undefined?null:v); });
    return out;
  }
  function clean(v){ return JSON.parse(JSON.stringify(v,function(k,x){ return x===undefined?null:x; })); }
  function docRef(path){
    return {path:path,
      onSnapshot:function(next,err){ var r=ref(path), h=function(s){ next(snapDoc(s)); }; r.on('value',h,function(e){ err&&err({code:'unavailable',message:String(e)}); }); return function(){ r.off('value',h); }; },
      get:function(){ return ref(path).once('value').then(snapDoc); },
      set:function(d){ return ref(path).set(clean(d)); },
      update:function(d){ return ref(path).update(flat(clean(d),'',{})); },
      delete:function(){ return ref(path).remove(); }
    };
  }
  function colRef(path){
    return {path:path,
      doc:function(id){ return docRef(path+'/'+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8)))); },
      onSnapshot:function(next,err){ var r=ref(path), h=function(s){ var docs=[]; s.forEach(function(c){ docs.push(snapDoc(c)); }); next({docs:docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:function(){return[];}}); };
        r.on('value',h,function(e){ err&&err({code:'unavailable',message:String(e)}); }); return function(){ r.off('value',h); }; }
    };
  }
  var dbApi=fdb?{doc:docRef,collection:colRef}:null;

  // 附件：存成 base64 在 subsidy/files/<id>
  function b64(buf){ var b=new Uint8Array(buf),s='',CH=0x8000; for(var i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH)); return btoa(s); }
  var assetsApi=fdb?{
    upload:function(file){
      if(file.size>15*1024*1024) return Promise.reject({code:'too_large'});
      return file.arrayBuffer().then(function(buf){
        var id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
        return ref('files/'+id).set({name:file.name,type:file.type,size:file.size,data:b64(buf)}).then(function(){ return {id:id,url:'',sizeBytes:file.size,contentType:file.type}; });
      });
    },
    delete:function(id){ return ref('files/'+id).remove(); },
    list:function(){ return Promise.resolve({assets:[],usage:{}}); }
  }:null;
  window.__fbBytes=function(id){ return ref('files/'+id+'/data').once('value').then(function(s){ var v=s.val(); if(!v) throw new Error('missing'); var bin=atob(v), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }); };

  window.claude={use:function(n){ return Promise.resolve({db:dbApi,assets:assetsApi,downloads:downloadsApi}[n]||null); }};

<body>
<title>托育補助小幫手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: sticky brand bar + tab row, one working column (max 1080px); cards use the 小布迪 thick-ink outline + offset shadow */
:root{
  --ground:#FFF6E6; --card:#FFFFFF; --ink:#2E2A3A; --muted:#5B5466; --line:#2E2A3A;
  --yellow:#F2B33D; --teal:#3E8E8A; --teal-t:#2F7470; --purple:#9B6BB0; --coral:#EF7D57; --coral-t:#B8502F;
  --soft:#FCE7B0; --tealsoft:#DCEFEC; --coralsoft:#FCE0D5; --track:#EFE6D6; --shadow:rgba(46,42,58,.16);
  --bubble:#FCE7B0; --on-accent:#2E2A3A; --accent:var(--yellow);
  --f-body:'Noto Sans TC',"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:'Baloo 2','Noto Sans TC',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1D1B25; --card:#2A2735; --ink:#F4EFE7; --muted:#BDB4C8; --line:#5A5070;
  --teal-t:#7CCFC2; --coral-t:#F4A184; --soft:#4A3C1C; --tealsoft:#1E3A38; --coralsoft:#45281F; --track:#3A3548; --shadow:rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1D1B25; --card:#2A2735; --ink:#F4EFE7; --muted:#BDB4C8; --line:#5A5070;
  --teal-t:#7CCFC2; --coral-t:#F4A184; --soft:#4A3C1C; --tealsoft:#1E3A38; --coralsoft:#45281F; --track:#3A3548; --shadow:rgba(0,0,0,.35);
  color-scheme:dark}
body[data-center="bbn"]{--accent:var(--purple); --on-accent:#FFFFFF}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ground);border-bottom:2.5px solid var(--line)}
.bar1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 240px}
.mascot{width:48px;height:48px;border-radius:50%;background:var(--bubble);border:2.5px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.mascot svg{width:40px;height:48px;margin-top:6px}
.brand h1{font-size:19px;font-weight:900;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.seg{display:flex;border:2.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sync{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.sync.ok{background:var(--tealsoft)} .sync.warn{background:var(--coralsoft)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--ink);font-weight:700;padding:6px 14px;border-radius:999px;border:2.5px solid transparent;font-size:14.5px}
nav a:hover{border-color:var(--line)}
nav a[aria-current="page"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

main{padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px 18px 24px 16px;box-shadow:0 4px 0 var(--shadow);padding:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:900}
.sec-h .meta{font-size:13px;color:var(--muted)}
.eyebrow{font-family:var(--f-num);font-weight:800;font-size:12px;letter-spacing:1.4px;color:var(--teal-t);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.muted{color:var(--muted)}
.empty{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding:6px 0}
.empty svg{width:46px;height:56px;flex:none}

/* hero */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.hero .big{width:104px;height:124px;flex:none}
.hero-t{flex:1;min-width:220px}
.hero-t h2{font-size:24px;font-weight:900;line-height:1.3}
.hero-t p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-family:var(--f-num);font-size:28px;line-height:1.1;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat.alert b{color:var(--coral-t)}

/* tasks */
.task{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.task.done{background:var(--tealsoft)}
.task.done .tt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.tk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700}
.tk .tt{flex:1;min-width:0}
.tn{font-size:13px;color:var(--muted);padding-left:34px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.chip.due{background:var(--soft)} .chip.late{background:var(--coralsoft);color:var(--coral-t);border-color:var(--coral)}
.chip.ok{background:var(--tealsoft)} .chip.when{background:var(--card)}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;padding-left:34px}
.docrow{display:flex;align-items:center;gap:10px;padding-left:34px}
.docbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.docbtn:hover{background:var(--soft)}
.prog{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:99px}
.docs{list-style:none;margin:2px 0 0;padding:0 0 0 34px;display:flex;flex-direction:column;gap:4px}
.docs label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.calcline{padding-left:34px;font-size:13px;font-weight:700;color:var(--teal-t)}
.calcline a{color:inherit}

input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:0;border:2.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;display:grid;place-items:center}
.docs input[type=checkbox]{width:20px;height:20px;border-radius:6px;margin-top:2px}
input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.docs input[type=checkbox]::after{width:5px;height:9px}
input[type=checkbox]:checked{background:var(--teal);border-color:var(--teal)}
input[type=checkbox]:checked::after{opacity:1}

/* calendar */
.yearbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.month{display:flex;flex-direction:column;gap:10px}
.month.now{outline:4px solid var(--accent);outline-offset:3px}
.mh{display:flex;align-items:center;gap:10px}
.mnum{font-family:var(--f-num);font-weight:800;font-size:30px;line-height:1;width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);border:2.5px solid var(--line);display:grid;place-items:center;flex:none}
.mh h3{font-size:16px;font-weight:900}
.mh .mp{font-size:12px;color:var(--muted);font-weight:700}
.hol{display:flex;flex-direction:column;gap:3px;font-size:13px;background:var(--ground);border-radius:12px;padding:8px 10px;border:1.5px dashed var(--line)}
.hol div{display:flex;gap:8px}
.hol .d{font-family:var(--f-num);font-weight:800;min-width:92px;color:var(--coral-t)}

/* cases */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.type{display:flex;gap:10px;align-items:center;text-align:left;border:2.5px solid var(--line);background:var(--card);border-radius:18px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.type:hover{background:var(--soft)}
.type[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.type svg{width:38px;height:46px;flex:none}
.type b{display:block;font-weight:900}
.type span{font-size:12.5px;opacity:.85}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
.field input,.field select{font:inherit;font-weight:500;color:var(--ink);background:var(--ground);border:2.5px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0;max-width:100%}
.btn{border:2.5px solid var(--line);background:var(--accent);color:var(--on-accent);font-weight:900;border-radius:999px;padding:8px 18px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--coral);color:#fff}
.btn.sm{padding:4px 12px;font-size:13px;box-shadow:0 2px 0 var(--line)}
.case{display:flex;flex-direction:column;gap:10px}
.case-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.case-h svg{width:34px;height:42px;flex:none}
.case-h .nm{flex:1;min-width:140px}
.case-h .nm b{font-size:16px;font-weight:900}
.case-h .nm span{display:block;font-size:12.5px;color:var(--muted)}
.ring{font-family:var(--f-num);font-weight:800;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.steps h4{margin:0 0 6px;font-size:13px;font-weight:900;color:var(--teal-t);letter-spacing:.5px}
.steps ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.steps input[type=checkbox]{width:20px;height:20px;border-radius:6px;margin-top:2px}
.steps input[type=checkbox]::after{width:5px;height:9px}
.tip{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13.5px}
.tip b{font-weight:900}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
details.done-list summary{cursor:pointer;font-weight:700;color:var(--muted)}

/* calc */
.calc-io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.calc-io{grid-template-columns:1fr}}
.out{display:flex;flex-direction:column;gap:0;border:2.5px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}
.out div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1.5px dashed var(--line)}
.out div:first-child{border-top:0}
.out .k{font-size:14px}
.out .k small{display:block;color:var(--muted);font-size:12px}
.out .v{font-family:var(--f-num);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.out .hl{background:var(--soft)}
.out .hl2{background:var(--tealsoft)}
.kids{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.kid{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center}
.kid input,.kid select{font:inherit;color:var(--ink);background:var(--ground);border:2.5px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0;width:100%}
.x{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:16px;font-weight:700;font-size:14px;z-index:20;transition:all .3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 優化補助 */
.tblwrap{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
.ptbl{border-collapse:collapse;font-size:13px;white-space:nowrap}
.ptbl th{background:var(--soft);font-weight:700;padding:6px 6px;text-align:left;position:sticky;top:0}
.ptbl td{padding:3px 4px;border-top:1px solid var(--track)}
.ptbl tr.off td{opacity:.45}
.ptbl input{font:inherit;color:var(--ink);background:var(--ground);border:1.5px solid var(--track);border-radius:8px;padding:4px 6px}
.ptbl input[type=checkbox]{width:20px;height:20px;border-radius:6px;border:2.5px solid var(--line);padding:0}
.ptbl input[type=checkbox]::after{width:5px;height:9px}
.btn[disabled]{opacity:.6;cursor:progress}
.pv{display:flex;flex-wrap:wrap;gap:14px;--pv:.38}
@media (max-width:600px){.pv{--pv:.27}}
.pvbox{width:calc(794px * var(--pv));height:calc(1123px * var(--pv));overflow:hidden;border:2px solid var(--line);border-radius:6px;background:#fff;flex:none;max-width:100%}
.pvbox.land{width:calc(1123px * var(--pv));height:calc(794px * var(--pv))}
.pvin{transform:scale(var(--pv));transform-origin:0 0}
#pdfstage{position:fixed;left:-20000px;top:0}
.pg{background:#fff;color:#000;position:relative;overflow:hidden;box-sizing:border-box;font-family:'DFKai-SB','標楷體','BiauKai','BiauKaiTC','BiauKai TC','TW-Kai','全字庫正楷體','Kaiti TC','LXGW WenKai TC',serif;font-size:16px;line-height:1.3}
.pg.p{width:794px;height:1123px}.pg.l{width:1123px;height:794px}
.pg .ft{border-collapse:collapse;table-layout:fixed}
.pg .ft td{border:1px solid #000;padding:2px 5px;vertical-align:middle;word-break:break-all}
.pg .ft.xl td{padding:1px 3px;line-height:1.2}
.pg .ft td.nb{border:0}
.pg .ft td.c{text-align:center}.pg .ft td.r{text-align:right}
.pg .ft td.bl{background:#DDEBF7}.pg .ft td.yl{background:#FFF2CC}
.pg .ft tr.gy td{background:#BFBFBF}
.pg .ft td.thk{border-left:2.5px solid #000;border-right:2.5px solid #000}
.pg .ft.dis td{padding:2px 3px;line-height:1.25}
.pg .sm{font-size:10.7px;color:#7f7f7f}

/* ───────── 流程（行政事務） ───────── */
const FLOWS = {
  enroll:{name:'新生入托',ch:'budi',desc:'線上＋紙本都要送',
    online:['確認掛名老師（托育人員收托回報）','機構管理 → 收托管理：新增家長資料','新增幼兒資料','收托人員掛上老師','托育補助：新增一筆','全部確認好再送審'],
    paper:['審核表','申請表','戶口名簿（不同戶都要附上）','身分證（父母雙方）','定型化契約','郵局存簿影本'],

  withdraw:{name:'幼兒退托',ch:'sha',desc:'線上＋紙本 mail 給蔡小姐',
    online:['托育補助 → 異動申請','類別選「解除托育」','查詢要退托的幼兒並送出'],
    paper:['停止托育補助表'],

  safety:{name:'公安檢查',ch:'lulu',desc:'兩年一次，備齊 6 份',

/* ───────── 工具 ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WK = '日一二三四五六';
const money = n => (Math.round(n)||0).toLocaleString('zh-TW');
const today = new Date(); today.setHours(0,0,0,0);
const ROC_NOW = today.getFullYear()-1911, M_NOW = today.getMonth()+1;
const rocDate = d => `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`;
const monthEnd = (roc,m) => new Date(roc+1911, m, 0);
const daysLeft = (roc,m) => Math.round((monthEnd(roc,m)-today)/864e5);
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
const fmtD = s => { const d=parseDate(s); return d?rocDate(d):''; };
const parseDate = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

/* ───────── 狀態 ───────── */
const YEARS = [ROC_NOW, ROC_NOW+1].filter(y=>y>=foundedRoc());
if(!YEARS.includes(116)) YEARS.push(116);
YEARS.sort();
const DEFAULT_SETTINGS = {kids:0, op:1262000, disQ:1, dis:[]};
const S = {
  center: CENTER_ID,
  tab: 'home', year: ROC_NOW,
  checks:{}, yearExists:{}, cases:[], settings:{...DEFAULT_SETTINGS},
  open:new Set(), newType:null, caseOpen:null, confirmDel:null, mode:'loading'
};

/* ───────── 資料層：共用資料庫（db），沒有時退回本機 ───────── */
let db=null, unsubs=[], loadTimer=null;
const queues={};
function enqueue(path,fn){
  queues[path]=(queues[path]||Promise.resolve()).then(fn).catch(e=>{
    toast(e && e.code==='quota_exceeded' ? '資料庫已滿，請刪掉一些已完成的案件' : '沒有存到，請確認你有編輯權限後再試一次');
  });
}
const base = () => `centers/${S.center}`;
function localKey(){ return 'local:'+S.center; }
function loadLocal(){
  let o={}; try{ o=JSON.parse(lsGet(localKey())||'{}'); }catch(e){}
  S.checks=o.checks||{}; S.cases=o.cases||[]; S.settings={...DEFAULT_SETTINGS,...(o.settings||{})};
}
function saveLocal(){ lsSet(localKey(), JSON.stringify({checks:S.checks,cases:S.cases,settings:S.settings})); }

function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  S.checks={}; S.yearExists={}; S.cases=[]; S.settings={...DEFAULT_SETTINGS};
  if(!db){ loadLocal(); setMode('local'); optSubscribe(); profSubscribe(); disSubscribe(); DIS.prevKids=undefined; render(); return; }
  setMode('loading'); render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{ if(S.mode==='loading') setMode('slow'); },10000);
  const c=S.center;
  const done = snap => { if(!snap.metadata.fromCache && S.center===c){ clearTimeout(loadTimer); setMode('live'); } };
  const err = () => { if(S.center===c){ clearTimeout(loadTimer); setMode('error'); } };
  YEARS.forEach(y=>{
    unsubs.push(db.doc(`${base()}/years/${y}`).onSnapshot(s=>{
      if(S.center!==c) return;
      S.yearExists[y]=s.exists; S.checks[y]={...((s.data()||{}).checks||{})}; done(s); softRender();
    },err));
  });
  unsubs.push(db.collection(`${base()}/cases`).onSnapshot(s=>{
    if(S.center!==c) return;
    S.cases=s.docs.map(d=>({id:d.id,...d.data()})); done(s); softRender();
  },err));
  optSubscribe(); profSubscribe(); disSubscribe(); DIS.prevKids=undefined;
  unsubs.push(db.doc(`${base()}/settings/main`).onSnapshot(s=>{
    if(S.center!==c) return;
    S.settings={...DEFAULT_SETTINGS,...(s.data()||{})}; S.settings.dis=(S.settings.dis||[]).filter(Boolean); done(s);
    if(S.tab==='calc' && document.activeElement && $('main').contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
    softRender();
  },err));
}
function setMode(m){
  S.mode=m; const el=$('sync');
  const map={loading:['連線中…',''],live:['已同步・全園共用','ok'],slow:['連不上資料庫，資料可能不是最新','warn'],error:['資料庫無法使用','warn'],local:['只存在這台裝置','warn']};
  el.textContent=map[m][0]; el.className='sync '+map[m][1];
}

function setCheck(y,key,val){
  S.checks[y]=S.checks[y]||{}; S.checks[y][key]=val;
  if(!db){ saveLocal(); return; }
  const ref=db.doc(`${base()}/years/${y}`);
  enqueue(ref.path, async()=>{
    if(S.yearExists[y]) await ref.update({checks:{[key]:val}});
    else { await ref.set({checks:{...S.checks[y]}}); S.yearExists[y]=true; }
  });
}
function saveCase(c){
  const i=S.cases.findIndex(x=>x.id===c.id); if(i>=0) S.cases[i]=c; else S.cases.push(c);
  if(!db){ saveLocal(); return; }
  const {id,...body}=c; const ref=db.doc(`${base()}/cases/${id}`);
  enqueue(ref.path, ()=>ref.set(body));
}
function deleteCase(id){
  S.cases=S.cases.filter(c=>c.id!==id);
  if(!db){ saveLocal(); return; }
  const ref=db.doc(`${base()}/cases/${id}`); enqueue(ref.path, ()=>ref.delete());
}
let setTimer=null;
function saveSettings(){
  if(!db){ saveLocal(); return; }
  clearTimeout(setTimer);
  setTimer=setTimeout(()=>{ const ref=db.doc(`${base()}/settings/main`); const body={...S.settings}; enqueue(ref.path, ()=>ref.set(body)); },700);
}

/* ───────── 計算 ───────── */
function grant(){
  const kids=Number(S.settings.kids)||0, op=Number(S.settings.op)||0;
  const fac=kids*2000, total=fac+op;
  return {kids,op,fac,total,p1:Math.round(total*0.7),p2:Math.round(total*0.3)};
}
function disTotal(){ return (S.settings.dis||[]).reduce((a,k)=>a+(Number(k.m)||0),0)*1500; }

/* ───────── 畫面 ───────── */
let pendingRender=false;
function softRender(){
  const a=document.activeElement;
  if(a && $('main').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.type!=='checkbox'){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout',()=>{ if(pendingRender){ setTimeout(()=>{ if(pendingRender){ pendingRender=false; softRender(); } },50); } });

function taskHTML(t,y,showWhen){
  const ck=S.checks[y]||{}, done=!!ck[t.id];
  const key=y+':'+t.id, open=S.open.has(key);
  const dn=t.docs?t.docs.filter((_,i)=>ck[t.id+'~'+i]).length:0;
  const dl=daysLeft(y,t.m);

function upcoming(){
  const out=[];
  for(let k=0;k<3;k++){
    let m=M_NOW+k, y=ROC_NOW; if(m>12){m-=12;y++;}
    activeTasks(m,y).forEach(t=>out.push({t,y,m,k}));
  }
  return out;
}
function overdue(){
  const out=[];
  for(let k=1;k<=2;k++){
    let m=M_NOW-k, y=ROC_NOW; if(m<1){m+=12;y--;}
    activeTasks(m,y).forEach(t=>{ if(!(S.checks[y]||{})[t.id]) out.push({t,y,m}); });
  }
  return out;
}

function withdrawDate(s){
  const d=parseDate(s); if(!d) return '';
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  let restWeekdays=0; for(let x=new Date(d.getTime()+864e5); x<=last; x=new Date(x.getTime()+864e5)) if(x.getDay()%6!==0) restWeekdays++;
  if(restWeekdays===0){ const n=new Date(d.getFullYear(),d.getMonth()+1,1); return `讀滿整個月 → 系統填 <b>${rocDate(n)}</b>`; }
  return `這個月還有 ${restWeekdays} 個上課日，不算讀滿整月，系統日期請再確認`;
}

function capNum(n){ // 0–9999 → 國字大寫
  n=Math.floor(n); if(!n) return '零';
  const u=['仟','佰','拾',''], s=String(n).padStart(4,'0'); let out='', zero=false;
  for(let i=0;i<4;i++){ const d=+s[i];

    if(zero){ out+='零'; zero=false; }
    out+=CAPN[d]+u[i];

  return out;
}

/* 申請期間：預設整季，可自己改起迄（例如社會局准請到 11 月底） */
function periodOf(y,q,d){ const qs=new Date(y+1911,q*3-3,1), s=(d&&d.pStart)||isoOf(qs<foundedDate()?foundedDate():qs), e=(d&&d.pEnd)||isoOf(new Date(y+1911,q*3,0)); return [s,e]; }
function periodQs(s,e){ const a=parseDate(s),b=parseDate(e); if(!a||!b) return []; const qa=Math.ceil((a.getMonth()+1)/3), qb=Math.ceil((b.getMonth()+1)/3)+(b.getFullYear()-a.getFullYear())*4; const r=[]; for(let q=qa;q<=qb;q++) r.push(((q-1)%4)+1); return r; }
function periodMonths(s,e){ const a=parseDate(s),b=parseDate(e); if(!a||!b||b<a) return []; const r=[]; for(let y=a.getFullYear(),m=a.getMonth(); new Date(y,m,1)<=b; m++){ if(m>11){m=0;y++;} r.push(m+1); } return r; }
const qLabelOf=qs=>qs.length>1?`${qs[0]}-${qs[qs.length-1]}`:String(qs[0]||'');
const qCnOf=qs=>qs.length>1?`${QCN[qs[0]]}至${QCN[qs[qs.length-1]]}`:QCN[qs[0]||1];
function periodField(pre,y,q,d){ const [s,e]=periodOf(y,q,d), custom=!!(d.pStart||d.pEnd);
  return `<div class="field"><label for="${pre}-ps">申請期間（起）</label><input type="date" id="${pre}-ps" data-period="pStart" data-pre="${pre}" value="${esc(s)}"></div>
  <div class="field"><label for="${pre}-pe">申請期間（迄）</label><input type="date" id="${pre}-pe" data-period="pEnd" data-pre="${pre}" value="${esc(e)}"></div>
  ${custom?`<button class="btn ghost sm" data-act="${pre}-preset" style="align-self:flex-end">恢復整季</button>`:''}`; }
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isoToday=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function optDefault(){
  return {fillDate:isoToday(), receiptDate:'', req:{1:true,2:true,3:true,4:true,5:true,6:false,7:true}, welfare:'none',
    amount:0, numStyle:'cap', ros:{cap:'',act:'',per:125000,eval:'優',ins:'符合',days:'符合',people:[]}, months:qMonths(OPT.q).map(m=>({month:m,rows:[]})), sign:{}, files:{}, imported:''};
}
const optPath=()=>`${base()}/opt/${OPT.y}-q${OPT.q}`;
const profPath=()=>`${base()}/profile/main`;
const optLocalKey=()=>`local:${S.center}:opt:${OPT.y}-q${OPT.q}`;

function optSubscribe(){
  if(OPT.unsub){ try{OPT.unsub()}catch(e){} OPT.unsub=null; }
  OPT.d=null; OPT.exists=false; OPT.local={};
  if(!db){
    try{ OPT.d=JSON.parse(lsGet(optLocalKey())||'null'); }catch(e){}
    if(!OPT.d) OPT.d=optDefault(); OPT.exists=true; softRender(); return;
  }
  const y=OPT.y,q=OPT.q,c=S.center;
  OPT.unsub=db.doc(optPath()).onSnapshot(s=>{
    if(OPT.y!==y||OPT.q!==q||S.center!==c) return;
    OPT.exists=s.exists; OPT.d=s.exists?JSON.parse(JSON.stringify(s.data())):optDefault();
    if(!OPT.d.months||!OPT.d.months.length) OPT.d.months=periodMonths(...periodOf(OPT.y,q,OPT.d)).map(m=>({month:m,rows:[]}));
    OPT.d.ros=Object.assign({cap:'',act:'',per:125000,eval:'優',ins:'符合',days:'符合',people:[]},OPT.d.ros||{});
    OPT.d.months.forEach(m=>{ m.rows=(m.rows||[]).filter(Boolean); }); OPT.d.ros.people=(OPT.d.ros.people||[]).filter(Boolean);
    OPT.d.req=OPT.d.req||{}; OPT.d.sign=OPT.d.sign||{}; OPT.d.files=OPT.d.files||{};
    if(S.tab==='opt') softRender();
  },()=>{ OPT.d=OPT.d||optDefault(); if(S.tab==='opt') softRender(); });
}
function profSubscribe(){
  if(OPT.profUnsub){ try{OPT.profUnsub()}catch(e){} OPT.profUnsub=null; }
  OPT.profile={};
  if(!db){ try{ OPT.profile=JSON.parse(lsGet(`local:${S.center}:profile`)||'{}'); }catch(e){} return; }
  const c=S.center;
  OPT.profUnsub=db.doc(profPath()).onSnapshot(s=>{ if(S.center!==c) return; OPT.profile=JSON.parse(JSON.stringify(s.data()||{})); if(S.tab==='opt') softRender(); },()=>{});
}
let optTimer=null, profTimer=null;
function saveOpt(){
  if(!db){ lsSet(optLocalKey(),JSON.stringify(OPT.d)); return; }
  clearTimeout(optTimer);
  const path=optPath(), body=JSON.parse(JSON.stringify(OPT.d));
  optTimer=setTimeout(()=>enqueue(path,()=>db.doc(path).set(body)),700);
}
function saveProfile(){
  if(!db){ lsSet(`local:${S.center}:profile`,JSON.stringify(OPT.profile)); return; }
  clearTimeout(profTimer);
  const path=profPath(), body=JSON.parse(JSON.stringify(OPT.profile));
  profTimer=setTimeout(()=>enqueue(path,()=>db.doc(path).set(body)),700);
}
const staffDir=()=>(OPT.profile.staff=OPT.profile.staff||{});
const n0=v=>Number(v)||0;
function rosCalc(d){ const r=d.ros||{}, E=n0(r.act), A=Math.ceil(E/5), B=Math.ceil(E/4), C=Math.max(0,B-A), per=n0(r.per); return {E,A,B,C,per,total:per*C}; }
const effAmt=d=>n0(d.amount)||rosCalc(d).total;
function qEnd(){ return parseDate(periodOf(OPT.y,OPT.q,OPT.d)[1]); }
function workDays(iso){ const h=parseDate(iso); if(!h) return ''; const n=Math.round((qEnd()-h)/864e5)+1; return n>0?n+'天':''; }
const rocShort=iso=>{ const d=parseDate(iso); return d?`${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()}`:''; };
const rowA=r=>n0(r.fixed)+n0(r.other), rowB=r=>n0(r.labor)+n0(r.health)+n0(r.absent)+n0(r.od);

/* ── 匯入出勤薪資系統的檔案 ── */
async function optImport(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast('這個檔案讀不到，請選「優化補助薪資_…json」'); return; }
  if(j.kind!=='optimize-subsidy-salary'){ toast('這不是出勤薪資系統匯出的優化補助檔'); return; }
  if(j.rocYear!==OPT.y||j.quarter!==OPT.q){ OPT.y=j.rocYear; OPT.q=j.quarter; optSubscribe(); await new Promise(r=>setTimeout(r,600)); }
  const d=OPT.d||optDefault(), dir=staffDir();
  d.months=j.months.map(mo=>({month:mo.month, rows:mo.rows.map(r=>{
    const s=dir[r.name]||{};
    return {name:r.name,title:s.title||'托育人員',idno:s.idno||'',fixed:r.fixed,other:r.other,labor:r.labor,health:r.health,absent:r.absent,od:r.otherDeduct||0,note:r.note||'',skip:!!s.skip,hire:r.hire||'',ins:r.insured||0};
  })}));
  d.imported=`${new Date().toLocaleString('zh-TW')} 匯入（${j.months.reduce((a,m)=>a+m.rows.length,0)} 筆）`;
  OPT.d=d; saveOpt(); render(); toast(`已匯入 ${OPT.y} 年第 ${OPT.q} 季薪資`);
}

/* ── 附件 ── */
async function getAssets(){ if(OPT.assets===undefined){ try{ OPT.assets=await claude.use('assets'); }catch(e){ OPT.assets=null; } } return OPT.assets; }
async function optUpload(k,files){
  const a=db?await getAssets():null;
  OPT.busy='上傳中…'; render();
  for(const f of files){
    if(!/pdf|image\//.test(f.type)){ toast(`「${f.name}」不是 PDF 或圖片，略過`); continue; }
    if(a){
      try{ const r=await a.upload(f); (OPT.d.files[k]=OPT.d.files[k]||[]).push({id:r.id,url:r.url,name:f.name,type:f.type||r.contentType}); }
      catch(e){ toast(`「${f.name}」上傳失敗：${e&&e.code==='too_large'?'檔案太大':'請再試一次'}`); }
    } else (OPT.local[k]=OPT.local[k]||[]).push({file:f,name:f.name,type:f.type,local:true});
  }
  OPT.busy=''; saveOpt(); render();
}
async function optRemoveFile(k,i,local){
  if(local){ OPT.local[k].splice(i,1); render(); return; }
  const f=OPT.d.files[k][i]; OPT.d.files[k].splice(i,1); saveOpt(); render();
  const a=await getAssets(); if(a&&f&&f.id){ try{ await a.delete(f.id); }catch(e){} }
}
const slotFiles=k=>[...((OPT.d&&OPT.d.files[k])||[]),...(OPT.local[k]||[])];

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('load')); document.head.appendChild(s); }); }
async function libs(){

async function fileBytes(f){ if(f.file) return new Uint8Array(await f.file.arrayBuffer()); if(!f.url&&window.__fbBytes) return window.__fbBytes(f.id); const r=await fetch(f.url||('/_blob/'+f.id)); if(!r.ok) throw new Error('fetch'); return new Uint8Array(await r.arrayBuffer()); }

function dataUrlBytes(u){ const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function optPdf(){
  if(!OPT.d) return;

    OPT.busy='準備中…'; render();

    const step=()=>{ OPT.busy=`產生中 ${++done}/${total}…`; const b=document.querySelector('[data-act="o-pdf"]'); if(b) b.textContent=OPT.busy; };
    async function htmlPage(html){
      stage.innerHTML=html; const el=stage.firstElementChild, land=el.classList.contains('l');
      try{ if(!kaiOk()) await document.fonts.load('20px "LXGW WenKai TC"', el.textContent); await document.fonts.ready; }catch(e){}
      const c=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false});
      const img=await out.embedJpg(dataUrlBytes(c.toDataURL('image/jpeg',.92)));
      const [w,h]=land?[841.89,595.28]:[595.28,841.89];
      out.addPage([w,h]).drawImage(img,{x:0,y:0,width:w,height:h}); step();
    }
    async function files(k,label){
      for(const f of slotFiles(k)){
        try{
          const bytes=await fileBytes(f), t=f.type||'';
          if(t.includes('pdf')){ const src=await PDFDocument.load(bytes,{ignoreEncryption:true}); (await out.copyPages(src,src.getPageIndices())).forEach(pp=>out.addPage(pp)); }
          else {
            const img = t.includes('png')? await out.embedPng(bytes) : (t.includes('jpeg')||t.includes('jpg'))? await out.embedJpg(bytes) : await out.embedJpg(await toJpeg(bytes,t));
            const land=img.width>img.height, [W,H]=land?[841.89,595.28]:[595.28,841.89], m=24;
            const s=Math.min((W-2*m)/img.width,(H-2*m)/img.height);
            out.addPage([W,H]).drawImage(img,{x:(W-img.width*s)/2,y:(H-img.height*s)/2,width:img.width*s,height:img.height*s});
          }
        }catch(e){ warn.push(`${label}「${f.name}」`); }
      }
    }
    const slot=k=>OPT_SLOTS.find(s=>s.k===k);
    const on=k=>{ const s=slot(k); return !s.when||s.when(OPT.d); };

    await files('bank','匯款帳戶影本');

    for(const h of pg.payroll) await htmlPage(h);
    await files('payproof','薪資匯款證明');
    for(const h of pg.sign) await htmlPage(h);
    for(const k of ['insproof','insroster','penproof','penroster','yearend','welfare']) if(on(k)) await files(k,slot(k).label);

    if(OPT.downloads===undefined){ try{ OPT.downloads=await claude.use('downloads'); }catch(e){ OPT.downloads=null; } }
    const name=`${CENTERS[S.center].name}_優化補助_${OPT.y}年第${OPT.q}季.pdf`;
    if(!OPT.downloads){ toast('這個畫面不能下載檔案，請在電腦瀏覽器開啟這個頁面'); }
    else {
      try{ await OPT.downloads.save({filename:name,data:bytes}); toast(warn.length?`已下載，但這些檔案讀不到：${warn.join('、')}`:`已下載 ${name}（${out.getPageCount()} 頁）`); }
      catch(e){ if(e&&e.code!=='declined') toast(e&&e.code==='host_unavailable'?'這個 App 不能存檔，請改用電腦瀏覽器':'下載失敗，請再按一次'); }
    }
  }catch(e){ console.error(e); toast('PDF 產生失敗，請確認網路後再試一次'); }

}

const kidCare=k=>k.careX!==''&&k.careX!=null?n0(k.careX):(DLEV[k.level]?DLEV[k.level].care*kidMonths(k):0);

/* 附件、存摺 */
const disSlotFiles=k=>[...((DIS.d&&DIS.d.files[k])||[]),...(DIS.local[k]||[])];
async function disUpload(k,files){
  const a=db?await getAssets():null; DIS.busy='上傳中…'; render();
  for(const f of files){
    if(!/pdf|image\//.test(f.type)){ toast(`「${f.name}」不是 PDF 或圖片，略過`); continue; }
    if(a){ try{ const r=await a.upload(f); (DIS.d.files[k]=DIS.d.files[k]||[]).push({id:r.id,url:r.url,name:f.name,type:f.type||r.contentType}); }catch(e){ toast(`「${f.name}」上傳失敗`); } }
    else (DIS.local[k]=DIS.local[k]||[]).push({file:f,name:f.name,type:f.type,local:true});
  }
  DIS.busy=''; saveDis(); render();
}
async function passbookUpload(owner,file){ // owner: '' = 中心，否則托育人員姓名
  if(!/image\//.test(file.type)){ toast('存摺封面請用照片或掃描圖檔（JPG、PNG）'); return; }
  const a=db?await getAssets():null; let ref;
  if(a){ try{ const r=await a.upload(file); ref={id:r.id,url:r.url,name:file.name,type:file.type}; }catch(e){ toast('上傳失敗'); return; } }
  else ref={local:true,name:file.name,type:file.type,obj:URL.createObjectURL(file)};
  if(owner===''){ OPT.profile.passbook=ref; } else { const dir=staffDir(); dir[owner]={...(dir[owner]||{}),passbook:ref}; }
  saveProfile(); render(); toast('存摺封面已上傳');
}
async function imgUrl(ref){
  if(!ref) return '';
  if(ref.obj) return ref.obj;
  const key=ref.id; if(DIS.imgs[key]) return DIS.imgs[key];
  try{ const b=await fileBytes(ref); DIS.imgs[key]=URL.createObjectURL(new Blob([b],{type:ref.type||'image/jpeg'})); }catch(e){ DIS.imgs[key]=''; }
  return DIS.imgs[key];
}

      const [w,h]=land?[841.89,595.28]:[595.28,841.89]; out.addPage([w,h]).drawImage(img,{x:0,y:0,width:w,height:h});
      const b=document.querySelector('[data-act="d-pdf"]'); if(b) b.textContent=`產生中 ${++done}/${htmls.length}…`;

        else { const im=t.includes('png')?await out.embedPng(bytes):(t.includes('jpeg')||t.includes('jpg'))?await out.embedJpg(bytes):await out.embedJpg(await toJpeg(bytes,t));
          const land=im.width>im.height, [W,H]=land?[841.89,595.28]:[595.28,841.89], m=24, sc=Math.min((W-2*m)/im.width,(H-2*m)/im.height);
          out.addPage([W,H]).drawImage(im,{x:(W-im.width*sc)/2,y:(H-im.height*sc)/2,width:im.width*sc,height:im.height*sc}); }
      }catch(e){ warn.push(`${s.label}「${f.name}」`); }

      catch(e){ if(e&&e.code!=='declined') toast('下載失敗，請再按一次'); } }
  }catch(e){ console.error(e); toast('PDF 產生失敗，請確認網路後再試一次'); }
  finally{ DIS.busy=''; render(); }
}

  else if(el.dataset.cg){ const dir=staffDir(), n=el.dataset.cg; dir[n]={...(dir[n]||{}),[el.dataset.cf]:el.value}; saveProfile(); }
  else return;
  if(DIS.preview){ clearTimeout(DIS._pv); DIS._pv=setTimeout(renderDisPreview,500); }
});

/* ───────── 互動 ───────── */
document.addEventListener('click',e=>{
  const cb=e.target.closest('[data-center]');
  if(cb && cb.tagName==='BUTTON'){ if(cb.dataset.center!==S.center){ S.center=cb.dataset.center; lsSet('center',S.center); S.caseOpen=null; S.newType=null; subscribe(); toast('切換到 '+CENTERS[S.center].name); } return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='toggle'){ const k=el.dataset.key; S.open.has(k)?S.open.delete(k):S.open.add(k); render(); }
  else if(a==='year'){ S.year=Number(el.dataset.y); render(); }
  else if(a==='newtype'){ S.newType = S.newType===el.dataset.type?null:el.dataset.type; render(); const n=$('nc-name'); if(n) n.focus(); }
  else if(a==='togglecase'){ S.caseOpen = S.caseOpen===el.dataset.id?null:el.dataset.id; S.confirmDel=null; render(); }
  else if(a==='opencase'){ S.caseOpen=el.dataset.id; }
  else if(a==='godis'){ DIS.y=+el.dataset.y; DIS.q=+el.dataset.q; disSubscribe(); DIS.prevKids=undefined; }
  else if(a==='goopt'){ OPT.y=+el.dataset.y; OPT.q=+el.dataset.q; optSubscribe(); }
  else if(a==='delask'){ S.confirmDel=el.dataset.id; render(); }
  else if(a==='delno'){ S.confirmDel=null; render(); }
  else if(a==='delyes'){ const c=S.cases.find(x=>x.id===el.dataset.id); deleteCase(el.dataset.id); S.confirmDel=null; S.caseOpen=null; render(); toast('已刪除「'+(c?c.name:'')+'」'); }
  else if(a==='close'){ const c=S.cases.find(x=>x.id===el.dataset.id); if(c){ const nc={...c,closed:!c.closed}; saveCase(nc); if(nc.closed) S.caseOpen=null; render(); toast(nc.closed?'已結案「'+c.name+'」':'已重新開啟'); } }
  else if(a==='disadd'){ S.settings.dis=[...(S.settings.dis||[]),{n:'',m:3}]; saveSettings(); render(); const i=S.settings.dis.length-1; const n=$('d-n-'+i); if(n) n.focus(); }
  else if(a==='disdel'){ const i=Number(el.dataset.i); S.settings.dis=(S.settings.dis||[]).filter((_,j)=>j!==i); saveSettings(); render(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='tick'){
    const y=Number(el.dataset.y), k=el.dataset.k, v=el.checked;
    setCheck(y,k,v);
    // 文件全勾 → 主事項自動完成
    const tid=k.split('~')[0], t=TASKS.find(x=>x.id===tid);
    if(k.includes('~') && t && t.docs && v && t.docs.every((_,i)=>(S.checks[y]||{})[tid+'~'+i]) && !(S.checks[y]||{})[tid]){ setCheck(y,tid,true); toast('文件都齊了，已把「'+t.title+'」標成完成'); }
    render();
  } else if(el.dataset.act==='cstep'){
    const c=S.cases.find(x=>x.id===el.dataset.id); if(!c) return;
    const nc={...c,checks:{...(c.checks||{}),[el.dataset.k]:el.checked}}; saveCase(nc);
    const [d,n]=caseProgress(nc); if(d===n && el.checked) toast('「'+c.name+'」全部完成，可以按結案');
    render();
  } else if(el.id==='d-q'){ S.settings.disQ=Number(el.value); saveSettings(); }
  else if(el.dataset.dis==='m'){ const i=Number(el.dataset.i); S.settings.dis[i]={...S.settings.dis[i],m:Number(el.value)}; saveSettings(); renderCalcOut(); }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='g-kids'){ S.settings.kids=Math.max(0,Number(el.value)||0); saveSettings(); renderCalcOut(); }
  else if(el.id==='g-op'){ S.settings.op=Math.max(0,Number(el.value)||0); saveSettings(); renderCalcOut(); }
  else if(el.dataset.dis==='n'){ const i=Number(el.dataset.i); S.settings.dis[i]={...S.settings.dis[i],n:el.value}; saveSettings(); }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='newcase') return;
  e.preventDefault();
  const name=$('nc-name').value.trim(); if(!name){ $('nc-name').focus(); return; }
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const c={id,type:S.newType,name,date:$('nc-date').value||'',checks:{},closed:false,created:new Date().toISOString()};
  saveCase(c); S.caseOpen=id; const fn=FLOWS[S.newType].name; S.newType=null; render(); toast('已建立'+fn+'：'+name);
});

function route(){
  const h=(location.hash||'').slice(1);
  S.tab=['home','calendar','cases','calc','opt','dis'].includes(h)?h:'home';
  render(); window.scrollTo(0,0);
}
addEventListener('hashchange',route);

/* ───────── 啟動 ───────── */
route();
(async()=>{
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  subscribe();
})();
</script>

</body>
</html>
